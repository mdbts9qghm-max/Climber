# Supabase CLI-Konfiguration (nur Edge Functions relevant)
project_id = "ehrwald-trainer"

[functions.whoop-auth]
verify_jwt = true

[functions.whoop-sync]
# Prüft selbst: Nutzer-JWT oder x-cron-secret (täglicher Abruf für alle)
